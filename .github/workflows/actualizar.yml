name: Actualizar Convenciones

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 06:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite lanzarlo a mano cuando tú quieras

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar rastreador
        run: python crawler.py

      - name: Guardar cambios si hay novedades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add convenciones.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización diaria de convenciones" && git push)
```[cite: 1]

4. Arriba a la derecha, pulsa en el botón verde **Commit changes...**[cite: 1].
5. En la ventana emergente, si quieres rellena el campo **Extended description** con la frase de arriba y haz clic abajo en el botón verde **Commit changes** para guardarlo[cite: 2, 3].

---

En cuanto lo guardes, la automatización quedará configurada al 100% y lista para ejecutarse sola a diario[cite: 1].
